<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
</head>
<body>
    <h1>Sign up</h1>
    <form action="{{ url_for('api.register') }}" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="0" step="1" required>
        <br>
        <label for="mass">Mass:</label>
        <input type="number" id="mass" name="mass" min="0" step="any" required>
        <br>
        <label for="height">Height:</label>
        <input type="number" id="height" name="height" min="0" step="any" required>
        <br>
        <label for="sex">Sex:</label>
        <select id="sex" name="sex" required>
            <option value="" selected disabled>Select sex</option>
             <option value="male">Male</option>
            <option value="female">Female</option>
        </select>
        <br>
        <label for="refcode">Reference code:</label>
        <input type="text" id="refcode" name="refcode">
        <br>
        <button type="submit">Create account</button>
    </form>
    <form action="{{ url_for('main.login') }}" method="get">
        <button type="submit">Back to login</button>
    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
</body>
</html>
