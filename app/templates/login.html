{% extends "base.html" %}

{% block title %}Log In — 11:56{% endblock %}
{% block body_class %}auth{% endblock %}
{% block page_class %}page--auth{% endblock %}

{% block content %}
<div class="auth__bg" aria-hidden="true">
  <img src="{{ url_for('static', filename='assets/starfield.jpg') }}" alt="">
</div>

<main class="auth-card">
  <h1 class="auth-card__title">Log In</h1>

  {% if error %}
    <p class="auth-card__error" style="position: absolute; top: calc(115 * var(--u)); left: 0; width: 100%; text-align: center; color: #ff6b6b; margin: 0; font-family: 'Inter', sans-serif; font-size: calc(16 * var(--u));">Invalid username or password.</p>
  {% endif %}

  <form action="{{ url_for('api.login') }}" method="post">
    <label class="field" style="--x:34; --y:177.97; --w:511.145">
      <span class="field__label">USERNAME</span>
      <input class="field__input" type="text" name="username" placeholder="Astronaut39..." autocomplete="username" required>
    </label>

    <div class="field field--password" style="--x:34; --y:317.97; --w:511.145">
      <label class="field__label" for="login-password">PASSWORD</label>
      <input class="field__input" id="login-password" type="password" name="password" autocomplete="current-password" required>
      <button class="password-toggle" type="button" aria-label="Show password" aria-controls="login-password" aria-pressed="false" data-password-toggle>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
          <path class="password-toggle__slash" d="m4 4 16 16"></path>
        </svg>
      </button>
    </div>

    <button class="btn" type="submit" style="--x:52; --y:453; --w:476.558; --h:94">LOG IN NOW</button>
  </form>

  <a class="auth-card__link" href="{{ url_for('main.register') }}">New here? Sign up now</a>
</main>
<script src="{{ url_for('static', filename='password-toggle.js', v='20261115-password-toggle') }}" defer></script>
{% endblock %}
